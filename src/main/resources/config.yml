money-steal-ratio: 0.33

# 株・投資システム設定
stock-sell-fee: 0.20           # 売却手数料 (20%)
stock-dividend-rate: 0.01      # 配当率 (株価の1%)
stock-dividend-interval-minutes: 60  # 配当間隔 (分)

# 上級職設定
# 昇格費用 (デフォルト: 20万G)
job-promote-fee: 200000
# 豪商専用ショップへの転送費用
wealthy-merchant-shop-fee: 10000
# 豪商専用ショップの座標 (コメントアウト状態 = 未設定 = /job shop 使用不可)
# wealthy-merchant-shop-world: world
# wealthy-merchant-shop-x: 0
# wealthy-merchant-shop-y: 64
# wealthy-merchant-shop-z: 0
respawn-protection-seconds: 600
combat-logout-seconds: 30
logout-grace-minutes: 15
wanted-duration-seconds: 1800
auction-interval-minutes: 30
auction-duration-seconds: 120

# ワールド分離設定
safe-world-name: economy
overworld-name: world
overworld-entry-fee: 1000
overworld-refund-ratio: 0.8

# オークションアイテムプール
# material: Bukkit Material 名（大文字）
# amount:   個数
# name:     表示名
# enchantments: （省略可）エンチャント本専用。"エンチャント名: レベル" の形式
auction-items:
  - material: EXPERIENCE_BOTTLE
    amount: 64
    name: "エンチャント瓶 x64"
  - material: SADDLE
    amount: 1
    name: "サドル"
  - material: DIAMOND_BLOCK
    amount: 2
    name: "ダイヤブロック x2"
  - material: ENCHANTED_BOOK
    amount: 1
    name: "幸運IIのエンチャント本"
    enchantments:
      LOOT_BONUS_BLOCKS: 2
  - material: EXPERIENCE_BOTTLE
    amount: 128
    name: "エンチャント瓶 x128"
  - material: BOOKSHELF
    amount: 5
    name: "本棚 x5"


# ショップワープ設定
shop-world: "economy"
shops:
  merchant:
    display: "商人ショップ"
    x: -460
    y: 110
    z: -471
  farmer:
    display: "農家ショップ"
    x: -466
    y: 110
    z: -471
  blacksmith:
    display: "鍛冶屋ショップ"
    x: -472
    y: 110
    z: -471
