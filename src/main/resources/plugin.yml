name: one_day_keizai
version: '${project.version}'
main: lobby.one_day_keizai.One_day_keizai
api-version: '1.20'
depend: [Vault, Multiverse-Core]

commands:
  bal:
    description: 残高確認
    usage: /bal
  auction:
    description: オークション入札・管理
    usage: /auction <金額|list|reload>
  ow:
    description: オーバーワールド移動
    usage: /ow <enter|return>
    permission: one_day_keizai.ow
    permission-message: §cこのコマンドは権限持ちのみ使用できます。
  job:
    description: 職業管理
    usage: /job <select|info|list> [職業名]
  stock:
    description: 株・投資システム (資本家限定)
    usage: /stock <info|buy|sell|offer|accept|reject>
  shop:
    description: 職業ショップへワープ（OP・コマンドブロック専用）
    usage: /shop <player> [shopKey]
    permission: one_day_keizai.shop
    permission-message: このコマンドは使用できません。
  compass:
    description: カスタムコンパスを入手
    usage: /compass <shop|wanted>
  wanted:
    description: 指名手配管理（OP専用）
    usage: /wanted <set|clear|list>
  farm:
    description: 農家スキル管理
    usage: /farm autoplant
  dirtrod:
    description: 無限の土の棒を渡す（OP専用）
    usage: /dirtrod [player]
  airdrop:
    description: エアドロップ管理（OP専用）
    usage: /airdrop <spawn|key [player]>
  wealthyenter:
    description: 豪商エリア入場チェック（コマンドブロック専用）
    usage: /wealthyenter <player|@p>

permissions:
  one_day_keizai.shop:
    description: /shop コマンドの使用権限（OP・コマンドブロック専用）
    default: op
  one_day_keizai.ow:
    description: /ow コマンドの使用権限
    default: op
